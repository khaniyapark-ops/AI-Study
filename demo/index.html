<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 유지보수 워크벤치</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#e2e5ea;--pri:#0b6e6e;--pri2:#e3f3f2;--warn:#b54708;--code:#0f1720}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8ecf1;--mute:#98a2b3;--line:#2a3441;--pri:#4fc3bd;--pri2:#16312f;--warn:#f7a35c;--code:#0a0e13}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{padding:18px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0}
header .sp{flex:1}
.mode{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.keynote{flex-basis:100%;font-size:12px;color:var(--mute);margin-top:2px}
.mode input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:230px}
nav{display:flex;gap:6px;padding:12px 24px 0;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:0 24px 40px}
.intro{background:var(--pri2);border-radius:10px;padding:12px 16px;margin:16px 0;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600}
textarea{width:100%;min-height:210px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--code);color:#d7e2ee;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
textarea.p{min-height:120px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
button.go{background:var(--pri);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.5;cursor:wait}
button.sub{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri)}
.tag.live{background:#fde7d3;color:var(--warn)}
#out{min-height:340px;white-space:normal}
#out h2,#out h3,#out h4{margin:14px 0 4px;font-size:15px}
#out ul{margin:4px 0 8px;padding-left:20px}
#out pre{background:var(--code);color:#d7e2ee;padding:10px;border-radius:8px;overflow:auto;font-size:12.5px}
#out code{font-family:ui-monospace,Menlo,monospace;background:var(--pri2);padding:0 4px;border-radius:4px}
#out pre code{background:none;padding:0}
#out table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
#out th,#out td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
#out th{background:var(--pri2)}
.cur::after{content:"▍";animation:b 1s steps(2) infinite;color:var(--pri)}
@keyframes b{50%{opacity:0}}
.tips{font-size:13px;color:var(--mute);margin-top:8px}
.agrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
@media(max-width:900px){.agrid{grid-template-columns:1fr}}
.toolrow{display:block;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.toolrow small{color:var(--mute);padding-left:24px}
.kind{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--pri2);color:var(--pri)}
.kind.k-쓰{background:#fde7d3;color:var(--warn)}
.loopbar{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:10px;flex-wrap:wrap}
.loopbar span[id^=lp]{padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.loopbar span.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.loopbar .sp{flex:1}
#agLog{max-height:640px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.ev{border-radius:8px;padding:8px 12px;font-size:14px;background:var(--bg)}
.ev.head{font-weight:600;background:transparent;padding:0}
.ev.think{color:var(--mute);font-style:italic}
.ev.call{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--pri2);word-break:break-all}
.ev.obs pre{margin:4px 0 0;white-space:pre-wrap;font-size:12px;background:var(--code);color:#d7e2ee;padding:8px;border-radius:6px}
.ev.err{border:1px solid var(--warn)}
.ev.gate{border:2px solid var(--warn);background:#fde7d322}
.ev.warn{color:var(--warn)}
.ev.final{border:1px solid var(--pri)}
.ev.final h2{margin:4px 0;font-size:15px}
.ev.lesson{background:var(--pri2)}
</style>
</head>
<body>
<header>
  <h1>AI 유지보수 워크벤치</h1><span class="tag" id="modeTag">시연 모드 (오프라인)</span>
  <div class="sp"></div>
  <div class="mode">라이브 모드: Anthropic API 키
    <input id="key" type="password" placeholder="sk-ant-... (비우면 시연 모드)" autocomplete="off">
  </div>
  <div class="keynote">키 없이도 모든 데모가 <b>오프라인 재생</b>으로 동작합니다. 키를 넣으면 이 브라우저에서 <b>api.anthropic.com으로만</b> 직접 전송되며, 이 페이지는 키를 저장하거나 다른 곳으로 보내지 않습니다(새로고침하면 지워짐). 교육용 임시 키를 쓰고, 공용 PC에서는 입력하지 마세요.</div>
</header>
<nav id="nav"></nav>
<main>
  <div class="intro" id="intro"></div>
  <div class="grid" id="stdView">
    <div>
      <div class="card"><h3>① 입력 자료 (수정 가능)</h3><textarea id="input" spellcheck="false"></textarea></div>
      <div class="card" style="margin-top:16px"><h3>② 프롬프트 (역할·맥락·형식을 바꿔보세요)</h3><textarea id="prompt" class="p" spellcheck="false"></textarea>
        <div class="row"><button class="go" id="run">AI에게 요청</button><button class="sub" id="reset">초기화</button><span class="tips" id="tips"></span></div>
      </div>
    </div>
    <div class="card"><h3>③ AI 결과 — 반드시 사람이 검토합니다</h3><div id="out"></div></div>
  </div>
  <div id="agentView" style="display:none"></div>
</main>
<script>
// 에이전트 실습실 — 실제 에이전트 루프(Claude API 도구 사용)와 오프라인 재생
// 핵심 교육 포인트: ① 루프(생각→도구→관찰→재계획) ② 도구가 곧 능력 ③ 승인은 프로그램이 강제한다

const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.5.0/+esm";
const MODEL = "claude-opus-5-5";
let _sdk = null;
async function getClient(apiKey) {
  if (!_sdk) _sdk = (await import(SDK_URL)).default;
  // 교육용 데모: 키는 이 브라우저 안에서만 사용. 운영 환경에서는 서버에서 호출해야 함.
  return new _sdk({ apiKey, dangerouslyAllowBrowser: true });
}
window.getClient = getClient;
window.CLAUDE_MODEL = MODEL;

// ---------- 시뮬레이션 환경 (가상의 정산 시스템) ----------
const ENV = {
  logs: {
    "logs/app.log": `2026-11-06 02:00:00 INFO  [ReportJob] monthly-usage-report started (long query, no timeout) holder=conn#17
2026-11-06 02:09:58 INFO  [NIGHTLY_SETTLE] start batch=20261105 rows=184220
2026-11-06 02:10:01 WARN  [HikariPool-1] Connection is not available, request timed out after 30000ms (total=20, active=20, idle=0, waiting=14)
2026-11-06 02:10:31 ERROR [NIGHTLY_SETTLE] SettleService.settle(order=88231) failed
java.sql.SQLTransientConnectionException: HikariPool-1 - Connection is not available
    at com.acme.settle.SettleService.settle(SettleService.java:142)
2026-11-06 02:10:31 INFO  [NIGHTLY_SETTLE] retry 1/3 order=88231
2026-11-06 02:11:02 ERROR [NIGHTLY_SETTLE] retry 3/3 failed, batch halted`,
  },
  files: {
    "jobs/report_schedule.yaml": `job: monthly-usage-report
owner: report-team
cron: "0 2 * * *"        # 매일 02:00
query_timeout: none
connection_pool: HikariPool-1   # 정산 배치와 공유
created: 2026-11-04 (신규 배포)`,
    "jobs/nightly_settle.yaml": `job: NIGHTLY_SETTLE
cron: "0 2 * * *"        # 02:00 시작, 데이터 준비 후 02:10 본처리
connection_pool: HikariPool-1 (max 20)
retry: 3`,
    "src/SettleService.java": `public void settle(long orderId) {
    try (Connection c = pool.getConnection()) {   // try-with-resources: 반환 누락 없음
        ... // line 142
    }
}`,
  },
};
const FILE_LIST = Object.keys(ENV.files).concat(Object.keys(ENV.logs));

const TOOL_IMPL = {
  list_files: () => FILE_LIST.join("\n"),
  read_log: ({ path }) => ENV.logs[path] ?? err(`로그 없음: ${path}. 사용 가능: ${Object.keys(ENV.logs).join(", ")}`),
  read_file: ({ path }) => ENV.files[path] ?? err(`파일 없음: ${path}. list_files로 목록을 확인하세요.`),
  query_db_readonly: ({ sql }) => {
    if (/\b(insert|update|delete|drop|alter|truncate|grant)\b/i.test(sql))
      return err("거부됨: 이 도구는 읽기 전용입니다. 변경은 run_ops_action으로 승인을 요청하세요.");
    if (/pg_stat_activity|session|lock/i.test(sql))
      return `pid   | 실행시간 | state  | query
17    | 00:42:10 | active | /* monthly-usage-report */ SELECT ... FROM usage_log GROUP BY ...
(그 외 19개 세션: NIGHTLY_SETTLE 대기 중, idle in transaction 없음)`;
    if (/order|settle/i.test(sql)) return `미처리 주문: order_id >= 88231, 41,880건 (재처리 대상)`;
    return "0 rows";
  },
  run_tests: () => "정산 로직 테스트: 12 passed, 0 failed (SettleService 정상 동작)",
};
function err(msg) { return { __error: msg }; }

const TOOLS = [
  { name: "list_files", desc: "조회 가능한 로그·설정·소스 파일 목록", kind: "읽기",
    schema: { type: "object", properties: {}, required: [], additionalProperties: false } },
  { name: "read_log", desc: "로그 파일 읽기 (읽기 전용)", kind: "읽기",
    schema: { type: "object", properties: { path: { type: "string", description: "예: logs/app.log" } }, required: ["path"], additionalProperties: false } },
  { name: "read_file", desc: "설정·소스 파일 읽기 (읽기 전용)", kind: "읽기",
    schema: { type: "object", properties: { path: { type: "string" } }, required: ["path"], additionalProperties: false } },
  { name: "query_db_readonly", desc: "운영 DB 조회 SQL 실행 (SELECT만 허용)", kind: "읽기",
    schema: { type: "object", properties: { sql: { type: "string" } }, required: ["sql"], additionalProperties: false } },
  { name: "run_tests", desc: "정산 로직 테스트 실행", kind: "검증",
    schema: { type: "object", properties: {}, required: [], additionalProperties: false } },
  { name: "run_ops_action", desc: "운영 변경 실행(배치 재기동·잡 중지·스케줄 변경). 실행 전 반드시 사람이 승인", kind: "쓰기🛑",
    schema: { type: "object", properties: {
      action: { type: "string", enum: ["pause_job", "restart_batch", "change_schedule"] },
      target: { type: "string", description: "대상 잡 이름" },
      detail: { type: "string", description: "구체 내용 (예: 03:30으로 변경, order 88231부터 재처리)" },
      reason: { type: "string", description: "근거" } },
      required: ["action", "target", "detail", "reason"], additionalProperties: false } },
];

const SYSTEM = `당신은 SI 유지보수 운영 에이전트입니다. 주어진 도구로 직접 증거를 모아 장애 원인을 찾고 복구를 진행합니다.
- 추측하지 말고 도구로 확인하세요. 확인하지 못한 것은 '확인 필요'로 남기세요.
- 작업 전 한 줄로 무엇을 할지 말하고, 진행 중에는 짧게 상황을 공유하세요.
- 운영 변경은 run_ops_action으로만 할 수 있고, 시스템이 사람 승인을 받습니다. 거부되면 우회하지 말고 대안을 보고하세요.
- 끝나면 한국어로 보고하세요: **원인** / **근거**(어떤 도구로 무엇을 봤는지) / **조치 결과** / **남은 불확실성**.`;

const GOAL = "T-1005: 정산 배치(NIGHTLY_SETTLE)가 새벽 02:10에 멈췄습니다. 원인을 찾고, 안전하게 복구해 주세요.";

// ---------- 화면 ----------
const $a = (id) => document.getElementById(id);
const escA = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const state = { running: false, iter: 0, calls: 0, stop: false };

function buildAgentView() {
  const v = $a("agentView");
  v.innerHTML = `
  <div class="agrid">
    <div>
      <div class="card"><h3>① 목표 — 지시가 아니라 '목표'를 줍니다</h3>
        <textarea id="agGoal" class="p" style="min-height:80px">${escA(GOAL)}</textarea></div>
      <div class="card" style="margin-top:16px"><h3>② 에이전트에게 줄 도구 — 끄면 능력이 사라집니다</h3>
        <div id="agTools"></div>
        <div class="tips">도구를 바꾸면 새로 실행해야 적용됩니다(실행 중에는 바꿀 수 없음).</div></div>
      <div class="card" style="margin-top:16px"><h3>③ 실행</h3>
        <div class="row">
          <button class="sub" id="agChat">A. 챗봇처럼 묻기</button>
          <button class="go" id="agRun">B. 에이전트에게 맡기기</button>
          <button class="sub" id="agStop" disabled>중지</button>
        </div>
        <div class="row"><label class="tips">최대 반복 <input id="agMax" type="number" value="12" min="2" max="30" style="width:56px"></label>
          <label class="tips"><input type="checkbox" id="agAuto"> 🛑 승인 없이 자동 실행(L4 체험 — 위험)</label></div>
      </div>
    </div>
    <div class="card">
      <div class="loopbar"><span id="lp-plan">계획</span>→<span id="lp-tool">도구</span>→<span id="lp-obs">관찰</span>→<span id="lp-re">재계획</span>
        <span class="sp"></span><span class="tag" id="agCount">반복 0 · 도구 0</span></div>
      <div id="agLog"><p class="tips">A와 B를 차례로 눌러 차이를 보세요. 같은 목표, 전혀 다른 결과가 나옵니다.</p></div>
    </div>
  </div>`;
  $a("agTools").innerHTML = TOOLS.map((t) => `
    <label class="toolrow"><input type="checkbox" data-tool="${t.name}" checked>
      <code>${t.name}</code> <span class="kind k-${t.kind[0]}">${t.kind}</span><br><small>${escA(t.desc)}</small></label>`).join("");
  $a("agRun").onclick = () => runAgent();
  $a("agChat").onclick = () => runChat();
  $a("agStop").onclick = () => { state.stop = true; };
}

function phase(p) { ["plan", "tool", "obs", "re"].forEach((k) => $a("lp-" + k).classList.toggle("on", k === p)); }
function count() { $a("agCount").textContent = `반복 ${state.iter} · 도구 ${state.calls}`; }
function add(cls, html) { const d = document.createElement("div"); d.className = "ev " + cls; d.innerHTML = html; $a("agLog").appendChild(d); d.scrollIntoView({ block: "nearest" }); return d; }
function resetLog(title) { $a("agLog").innerHTML = `<div class="ev head">${title}</div>`; state.iter = 0; state.calls = 0; count(); }
function setRunning(on) { state.running = on; state.stop = false; $a("agRun").disabled = on; $a("agChat").disabled = on; $a("agStop").disabled = !on;
  document.querySelectorAll("#agTools input").forEach((i) => (i.disabled = on)); if (!on) phase(null); }
const enabledTools = () => TOOLS.filter((t) => document.querySelector(`#agTools input[data-tool="${t.name}"]`).checked);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// 사람 승인 게이트: 모델이 아니라 '프로그램'이 멈추고 사람을 기다린다
function approvalGate(input) {
  if ($a("agAuto").checked) { add("warn", "⚠ 자동 실행 모드: 사람 확인 없이 운영 변경이 실행되었습니다."); return Promise.resolve(true); }
  return new Promise((resolve) => {
    const d = add("gate", `<b>🛑 승인 요청 — 운영 변경</b><br><code>${escA(input.action)}</code> → <b>${escA(input.target)}</b><br>${escA(input.detail)}<br><small>근거: ${escA(input.reason)}</small>
      <div class="row"><button class="go">승인</button><button class="sub">거부</button></div>`);
    const [ok, no] = d.querySelectorAll("button");
    ok.onclick = () => { d.querySelector(".row").innerHTML = "<b>✅ 사람이 승인함</b>"; resolve(true); };
    no.onclick = () => { d.querySelector(".row").innerHTML = "<b>❌ 사람이 거부함</b>"; resolve(false); };
  });
}

async function execTool(name, input) {
  if (name === "run_ops_action") {
    const ok = await approvalGate(input);
    return ok ? `(시뮬레이션) 실행 완료: ${input.action} ${input.target} — ${input.detail}`
              : err("담당자가 승인을 거부했습니다. 실행하지 않았습니다.");
  }
  const fn = TOOL_IMPL[name];
  return fn ? fn(input || {}) : err(`알 수 없는 도구: ${name}`);
}
function showCall(name, input) {
  state.calls++; count(); phase("tool");
  add("call", `🔧 <code>${escA(name)}</code>(${escA(JSON.stringify(input))})`);
}
function showObs(out) {
  phase("obs");
  const isErr = out && out.__error;
  add(isErr ? "obs err" : "obs", `<b>👁 관찰</b><pre>${escA(isErr ? out.__error : out)}</pre>`);
}

// ---------- A. 챗봇 ----------
async function runChat() {
  const key = $a("key").value.trim();
  setRunning(true); resetLog("A. 챗봇: 도구 없이 질문에 한 번 답합니다");
  try {
    if (!key) { await sleep(500); add("final", window.mdRender(OFFLINE_CHAT)); }
    else {
      const client = await getClient(key);
      const r = await client.beta.messages.create({
        model: MODEL, max_tokens: 4000, betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
        thinking: { type: "adaptive", display: "summarized" }, output_config: { effort: "low" },
        messages: [{ role: "user", content: $a("agGoal").value }],
      });
      if (r.stop_reason === "refusal") add("obs err", "요청이 거절되었습니다: " + escA(r.stop_details?.explanation || ""));
      add("final", window.mdRender(r.content.filter((b) => b.type === "text").map((b) => b.text).join("\n")));
    }

async function runAgent() {
  const key = $a("key").value.trim();
  setRunning(true);
  resetLog(`B. 에이전트: 목표를 받아 스스로 도구를 쓰며 반복합니다 ${key ? `<span class="tag live">라이브 · ${MODEL}</span>` : '<span class="tag">오프라인 재생</span>'}`);
  try { key ? await liveLoop(key) : await offlineLoop(); }
  catch (e) { add("obs err", "오류: " + escA(e.message)); }
  add("lesson", "💡 같은 목표인데 B는 <b>증거를 직접 모으고</b>, 위험한 단계에서는 <b>프로그램이 멈춰 사람을 기다렸습니다</b>. 도구를 하나 끄고 다시 실행해 보세요.");
  setRunning(false);
}

async function liveLoop(key) {
  const client = await getClient(key);
  const tools = enabledTools().map((t) => ({ name: t.name, description: t.desc, input_schema: t.schema, strict: true }));
  const messages = [{ role: "user", content: $a("agGoal").value }];
  const max = +$a("agMax").value || 12;
  while (state.iter < max) {
    if (state.stop) { add("warn", "사용자가 중지했습니다."); return; }
    state.iter++; count(); phase(state.iter === 1 ? "plan" : "re");
    const thinkingEl = add("think", "💭 생각 중…");
    const r = await client.beta.messages.create({
      model: MODEL, max_tokens: 16000, system: SYSTEM, tools, messages,
      betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
      thinking: { type: "adaptive", display: "summarized" }, output_config: { effort: "medium" },
    });
    thinkingEl.remove();
    // 응답 블록을 순서대로 보여준다 (생각 요약 → 말 → 도구 호출)
    for (const b of r.content) {
      if (b.type === "thinking" && b.thinking) add("think", "💭 " + escA(b.thinking));
      else if (b.type === "text" && b.text.trim()) add("say", window.mdRender(b.text));
      else if (b.type === "fallback") add("warn", `안전 정책으로 ${escA(b.from?.model)} → ${escA(b.to?.model)}이(가) 이어서 답했습니다.`);
    }
    messages.push({ role: "assistant", content: r.content }); // 블록을 바꾸지 않고 그대로 돌려준다
    if (r.stop_reason === "refusal") { add("obs err", "요청이 거절되었습니다: " + escA(r.stop_details?.explanation || "")); return; }
    if (r.stop_reason === "max_tokens") { add("warn", "출력 한도에 도달해 중단했습니다."); return; }
    if (r.stop_reason !== "tool_use") { add("final", "<b>✅ 에이전트가 스스로 작업을 끝냈습니다.</b>"); return; }
    const results = [];
    for (const b of r.content.filter((x) => x.type === "tool_use")) {
      showCall(b.name, b.input);
      const out = await execTool(b.name, b.input);
      showObs(out);
      results.push(out && out.__error
        ? { type: "tool_result", tool_use_id: b.id, content: out.__error, is_error: true }
        : { type: "tool_result", tool_use_id: b.id, content: String(out) });
    }
    messages.push({ role: "user", content: results }); // 모든 결과를 한 메시지로
  }
  add("warn", `최대 반복(${max}회)에 도달해 멈췄습니다 — 무한 루프 방지도 가드레일입니다.`);
}

async function offlineLoop() {
  state.iter = 1; count(); phase("plan");
  for (const step of SCRIPT) {
    if (state.stop) { add("warn", "사용자가 중지했습니다."); return; }
    await sleep(700);
    if (step.think) { state.iter++; count(); phase("re"); add("think", "💭 " + escA(step.think)); }
    else if (step.tool) {
      if (!enabledTools().some((t) => t.name === step.tool)) {
        showCall(step.tool, step.input);
        showObs(err("이 도구는 꺼져 있습니다. (오프라인 재생은 정해진 시나리오라, 도구를 끈 효과는 라이브 모드에서 확인하세요)"));
        continue;
      }
      showCall(step.tool, step.input);
      await sleep(400);
      showObs(await execTool(step.tool, step.input));
    } else if (step.final) add("final", window.mdRender(step.final));
  }
}

부분취소 분기에서 **새 수수료 + 원 수수료**를 더합니다. 부분취소는 취소 금액 비례로 수수료를 **환급(음수)** 해야 하는데, 양수로 더해 이중 차감이 됩니다. 또 호출부가 \`original_fee\`에 어떤 값을 넘기는지(전체/비례)가 코드에 드러나지 않습니다.

## 3) 최소 수정
\`\`\`diff
-    if is_partial_cancel:
-        fee = fee + original_fee
+    if is_partial_cancel:
+        # original_fee: 취소분에 해당하는 원 수수료(비례분)
+        return -original_fee
     return fee
\`\`\`

## 4) 테스트 케이스
- 10,000원 부분취소, 비례 원수수료 300 → **-300**
- 최소수수료 경계: 1,000원 일반결제 → **100**
- 원수수료 0인 부분취소 → **0**(환급 없음)
- 일반결제 10,000원 → **300** (회귀)

## 5) 영향 범위
- \`settle()\`: 환급이 음수로 합산되므로 **일 합계가 감소**합니다. 마감 리포트(T-1002) 수치 변동 확인

   const cells=x=>x.replace(/^\||\|$/g,"").split(/(?<!\\)\|/).map(c=>c.trim());
   h+="<table><tr>"+cells(r[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr>"+r.slice(2).map(x=>"<tr>"+cells(x).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</table>";continue}
  if(/^- /.test(l)||/^\d\. /.test(l)){let it=[];while(i<L.length&&(/^- /.test(L[i])||/^\d\. /.test(L[i]))){it.push(L[i].replace(/^(- |\d\. )/,""));i++}h+="<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue}
  const m=l.match(/^(#{2,4}) (.*)/);if(m){h+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;i++;continue}
  if(l.startsWith("> ")){h+=`<p style="color:var(--warn)">${inline(l.slice(2))}</p>`;i++;continue}
  if(l.trim()){h+="<p>"+inline(l)+"</p>"}i++}
 return h}
function load(n){cur=n;const s=S[n];const lab=s.id==="agentlab";$("stdView").style.display=lab?"none":"";$("agentView").style.display=lab?"":"none";$("intro").innerHTML=(s.role?'<span class="tag">'+s.role+'</span> ':'<span class="tag">공통</span> ')+s.intro;if(!lab){$("input").value=s.input;$("prompt").value=s.prompt;$("tips").textContent=s.tips;}
 $("out").innerHTML='<p style="color:var(--mute)">왼쪽의 [AI에게 요청]을 누르면 결과가 여기에 나옵니다.</p>';
 [...$("nav").children].forEach((b,i)=>b.classList.toggle("on",i===n))}
S.forEach((s,i)=>{const b=document.createElement("button");b.textContent=s.name;b.onclick=()=>load(i);$("nav").appendChild(b)});
$("reset").onclick=()=>load(cur);
$("key").oninput=()=>{const live=!!$("key").value.trim();$("modeTag").textContent=live?"라이브 모드 (API 호출)":"시연 모드 (오프라인)";$("modeTag").className="tag"+(live?" live":"")};
async function typeOut(text){let i=0;const out=$("out");out.classList.add("cur");
 while(i<text.length){i=Math.min(text.length,i+6);out.innerHTML=md(text.slice(0,i));await new Promise(r=>setTimeout(r,12))}
 out.classList.remove("cur")}
async function live(key,prompt,input){
 const client=await getClient(key);
 const r=await client.beta.messages.create({model:CLAUDE_MODEL,max_tokens:16000,
  betas:["server-side-fallback-2026-07-01"],fallbacks:"default",
  thinking:{type:"adaptive"},output_config:{effort:"medium"},
  messages:[{role:"user",content:prompt+"\n\n<자료>\n"+input+"\n</자료>"}]});
 if(r.stop_reason==="refusal")throw new Error("요청이 거절되었습니다: "+(r.stop_details?.explanation||""));
 return r.content.filter(b=>b.type==="text").map(b=>b.text).join("\n")}
$("run").onclick=async()=>{const b=$("run");b.disabled=true;const key=$("key").value.trim();
 try{ if(key){$("out").innerHTML="<p>AI가 작성 중…</p>";const t=await live(key,$("prompt").value,$("input").value);await typeOut(t)}
  else{$("out").innerHTML="";await typeOut(S[cur].mock)} }
 catch(e){$("out").innerHTML='<p style="color:var(--warn)">오류: '+esc(e.message)+' — 시연 모드로 전환하려면 API 키를 비우세요.</p>'}
 b.disabled=false};
window.mdRender=md;buildAgentView();load(0);
</script>
